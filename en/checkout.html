  if (saved) open_(saved).catch(show); else show();
  document.getElementById("lock-form").addEventListener("submit", function (e) {
    e.preventDefault();
    open_(document.getElementById("lock-pw").value).catch(function () { document.getElementById("lock-err").textContent = "Wrong password. Try again."; });
  });
})();
</script>
