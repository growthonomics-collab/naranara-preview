    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (m) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(D.s), iterations: D.n, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b(D.i) }, k, b(D.c));
    }).then(function (buf) {
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
      document.body.innerHTML = new TextDecoder().decode(buf);
      var s = document.createElement("script"); s.src = "assets/js/main.js"; document.body.appendChild(s);
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
    });
  }
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  function show() { lock.hidden = false; document.getElementById("lock-pw").focus(); }
  if (saved) open_(saved).catch(show); else show();
  document.getElementById("lock-form").addEventListener("submit", function (e) {
    e.preventDefault();
    open_(document.getElementById("lock-pw").value).catch(function () { document.getElementById("lock-err").textContent = "Λάθος κωδικός. Δοκιμάστε ξανά."; });
  });
})();
</script>
